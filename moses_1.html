if(d.o){let x=0,y=0,z=-gs/2;const k=8+i;for(let j=0;j<k;j++){z-=3.4+rn(j+i)*.9;x=(rn(j*3+i)-.5)*3;y+=i==8?.45:i==6?.2:0;plat(x,y,z,2.4,2.4,j==k>>1?'4caf50':'c9a66b',.6,j==k>>1)}z-=4;plat(x,y,z,5,5,'ffd54f',.6);goal=[x,y+1.3,z]}

/* ===== CAMP BUILD SYSTEM (grid 9x9, cell 1.5, centre z=-3) ===== */
const OT={tent:'Tent|Lều',basin:'Water basin|Bồn nước',fire:'Fire pit|Đống lửa',table:'Table|Bàn ăn',flag:'Flag pole|Cột cờ',tree:'Tree|Cây',rock:'Rock|Đá',path:'Path|Đường đi',gate:'Gate|Cổng',store:'Storage|Kho đồ',seat:'Seat|Chỗ ngồi'};
const OI={tent:'⛺',basin:'💧',fire:'🔥',table:'🍽',flag:'🚩',tree:'🌴',rock:'🪨',path:'🟫',gate:'⛩',store:'📦',seat:'🪑'};
const BLD=[{h:'Design a desert shelter camp for the Israelites|Thiết kế khu trú ẩn cho dân Israel ở sa mạc',g:[['tent',4],['basin',1,'tent'],['fire',1,'c'],['tree',2]]},
{h:'Arrange the camp by the sea before moving on|Sắp xếp khu trại bên biển trước khi đi tiếp',g:[['gate',1],['path',3],['tent',3],['seat',2],['store',1]]},
{h:'Prepare a gathering place below Mount Sinai|Chuẩn bị nơi tập hợp dưới chân núi Sinai',g:[['fire',1,'c'],['seat',4],['table',2],['flag',1]]}];
const mk=f=>{const g=new THREE.Group();f(g);return g};
const OBJ={
tent:(a,b)=>mk(g=>{const m=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.3,4),mat(a));m.position.y=.65;m.rotation.y=.78;g.add(m);box(.4,.6,.05,b,0,.3,.64,g)}),

fire:()=>mk(g=>{box(.9,.12,.9,'808078',0,.06,0,g);box(.3,.4,.3,'ff9a1f',0,.32,0,g);box(.2,.3,.2,'ffd23f',0,.4,0,g)}),
table:(a,b)=>mk(g=>{box(1.1,.1,.7,a,0,.55,0,g);box(.1,.55,.6,b,-.45,.27,0,g);box(.1,.55,.6,b,.45,.27,0,g);box(.2,.12,.2,'c0392b',.2,.66,0,g)}),
flag:()=>mk(g=>{box(.1,2,.1,'6a4022',0,1,0,g);box(.7,.45,.05,'3a6ea8',.4,1.7,0,g)}),
tree:()=>mk(g=>{box(.3,1.8,.3,'8a5a2a',0,.9,0,g);box(1.4,.2,1.4,'3a9a3a',0,1.9,0,g);box(.7,.2,.7,'4ab04a',0,2.1,0,g)}),
rock:()=>mk(g=>{box(.9,.5,.8,'8a8a80',0,.25,0,g);box(.5,.4,.5,'9a9a90',.2,.6,.1,g)}),
path:()=>mk(g=>box(1.4,.06,1.4,'e8d49a',0,.03,0,g)),

const MT=[['c9a66b','8a5a2a'],['e8e0d0','a08a60'],['9a6a4a','5a3a1a']],rc=new THREE.Raycaster(),pv=new THREE.Vector2();
let bm=0,sel='tent',rot=0,mi=0,er=0,tv=0,bp=[],gridH;
function chk(){return BLD[CH[ch].k].g.map(([t,n,nr])=>{let it=bp.filter(q=>q.t==t);if(nr=='c')it=it.filter(q=>Math.hypot(q.x,q.z)<=2);else if(nr){const o=bp.filter(q=>q.t==nr);it=it.filter(q=>o.some(w=>Math.hypot(q.x-w.x,q.z-w.z)<=2.3))}return [t,n,nr,it.length]})}
function beginBuild(){bm=1;st=4;bp=[];sel='tent';rot=0;er=0;tv=0;gridH=new THREE.GridHelper(13.5,9,0xffffff,0xffffff);gridH.position.set(0,.06,-3);gridH.material.transparent=true;gridH.material.opacity=.45;W.add(gridH);$('bd').classList.remove('hide');bd();hud()}
function bd(){const p=$('bd');p.innerHTML='';const ad=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onclick=f;p.appendChild(b)};
Object.keys(OT).forEach(k=>ad(OI[k],()=>{sel=k;er=0;bd()},sel==k&&!er));
ad('↻ '+T('Rotate|Xoay'),()=>{rot=(rot+1)%4;bd()});ad('🎨 '+T('Material|Vật liệu'),()=>{mi=(mi+1)%3;bd()});ad('↩ '+T('Undo|Hoàn tác'),undo);ad('🗑 '+T('Erase|Xóa'),()=>{er=!er;bd()},er);ad('👁 '+T('Top view|Nhìn từ trên'),()=>{tv=!tv;bd()},tv);ad('✔ '+T('Done|Hoàn thành'),done);

function tap(e){const r=cv.getBoundingClientRect();pv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(pv,cam);const o=rc.ray.origin,d=rc.ray.direction,t=-o.y/d.y;if(!(t>0))return;
const gx=Math.round((o.x+d.x*t)/1.5),gz=Math.round((o.z+d.z*t+3)/1.5);if(Math.abs(gx)>4||Math.abs(gz)>4)return;const i=bp.findIndex(q=>q.x==gx&&q.z==gz);

/* ===== GAME LOOP ===== */
function step(dt,t){
let ix=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0)+jx,iy=(K.w||K.ArrowUp?1:0)-(K.s||K.ArrowDown?1:0)+jy,m=Math.hypot(ix,iy),mv=0;
if(!busy&&!bm&&m>.1){const n=Math.min(m,1)/m;ix*=n;iy*=n;const s=Math.sin(ya),c=Math.cos(ya),vx=-s*iy+c*ix,vz=-c*iy-s*ix;px+=vx*6*dt;pz+=vz*6*dt;pl.rotation.y=Math.atan2(vx,vz);mv=1}
if(JP&&on&&!busy){vy=8.5;JP=0;beep(660,.08)}
vy-=24*dt;let ny=py+vy*dt;on=0;
for(const q of P)if(Math.abs(px-q.x)<q.hw+.25&&Math.abs(pz-q.z)<q.hd+.25&&py>=q.t-.4&&ny<=q.t&&vy<=0){ny=q.t;vy=0;on=1;if(q.cp)cp=[q.x,q.t+.2,q.z]}
py=ny;if(py<-4){[px,py,pz]=cp;vy=0;beep(150,.3,'sawtooth')}
pl.position.set(px,py,pz);anim(pl,t,mv&&on,0);
if(bm){cam.position.set(0,tv?22:15,tv?.5:7);cam.lookAt(0,0,0)}else{const D=7,cs=Math.cos(pt);cam.position.set(px+Math.sin(ya)*D*cs,py+1.6+D*Math.sin(pt),pz+Math.cos(ya)*D*cs);cam.lookAt(px,py+1.4,pz)}
near=null;let nd=3;N.forEach(n=>{const dx=px-n.g.position.x,dz=pz-n.g.position.z,dd=Math.hypot(dx,dz);if(dd<5)n.g.rotation.y=Math.atan2(dx,dz);if(dd<nd){nd=dd;near=n}anim(n.g,t+n.ph,0,dd<4)});
$('bt').classList.toggle('hide',!near||busy||bm);$('br').classList.toggle('hide',!(st==2&&CH[ch].o));
fl.forEach((f,j)=>f.scale.y=1+.4*Math.sin(t*9+j));
if(goal&&st==2){goal.rotation.y=t*2;if(Math.hypot(px-goal.position.x,py+.8-goal.position.y,pz-goal.position.z)<1.7)win()}}
let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(play&&!pause&&W)step(dt,t/1000);R.render(S,cam)}

/* ===== UI, INPUT, SAVE, I18N ===== */
function hud(){$('sb').textContent='⭐'+stars;if(!play)return;const d=CH[ch];let o=T('Chapter|Chương')+' '+(ch+1)+'/9: '+T(d.t)+'\n';
o+=st==0?'🎯 '+T('Talk to|Nói chuyện với')+' '+T(C[d.n[0][0]][7]):st==2?T('🎯 Reach the golden star!|🎯 Chạm vào ngôi sao vàng!'):st==4?'🏕 '+T(BLD[d.k].h)+'\n'+chk().map(x=>(x[3]>=x[1]?'✅ ':'⬜ ')+T(OT[x[0]])+' '+x[3]+'/'+x[1]+(x[2]=='c'?T(' (center)| (ở giữa)'):x[2]?T(' (near |, gần ')+T(OT[x[2]])+')':'')).join('\n'):'✅';$('obj').textContent=o}

const sv=n=>{try{localStorage.setItem('mos',JSON.stringify({ch:n,stars}))}catch(e){}};
let s0;try{s0=JSON.parse(localStorage.getItem('mos'))}catch(e){}if(s0)$('bc').classList.remove('hide');
function start(n,s){stars=s;play=1;$('menu').classList.add('hide');$('hud').classList.remove('hide');load(n);ui()}
const tg=()=>{lang=1-lang;ui()},ts=()=>{snd=1-snd;ui()},jump=()=>{JP=1;setTimeout(()=>JP=0,160)};
$('bs').onclick=()=>start(0,0);$('bc').onclick=()=>start(s0.ch||0,s0.stars||0);$('bh').onclick=()=>$('how').classList.toggle('hide');
$('bl').onclick=$('bl2').onclick=tg;$('bn').onclick=$('bn2').onclick=ts;
$('bf').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('bp').onclick=()=>{pause=1-pause;$('bp').textContent=pause?'▶':'⏸'};
$('bj').onpointerdown=jump;$('bt').onclick=()=>near&&!busy&&talk(near);$('br').onclick=()=>{[px,py,pz]=cp;vy=0};
const cv=$('c');let dr=null;cv.onpointerdown=e=>{if(bm){tap(e);return}dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(dr){ya-=(e.clientX-dr[0])*.008;pt=Math.max(.1,Math.min(1.1,pt+(e.clientY-dr[1])*.006));dr=[e.clientX,e.clientY]}};cv.onpointerup=cv.onpointercancel=()=>dr=null;
const js=$('js'),jm=e=>{const r=js.getBoundingClientRect();let dx=e.clientX-r.left-65,dy=e.clientY-r.top-65;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l}$('kn').style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/50;jy=-dy/50};
js.onpointerdown=e=>{js.setPointerCapture(e.pointerId);jm(e)};js.onpointermove=e=>{if(js.hasPointerCapture(e.pointerId))jm(e)};js.onpointerup=js.onpointercancel=()=>{jx=jy=0;$('kn').style.transform=''};
const kn=e=>e.key.length>1?e.key:e.key.toLowerCase();
onkeydown=e=>{const k=kn(e);K[k]=1;if(k==' ')jump();if(k=='e'&&near&&!busy&&play)talk(near);if(k==' '||k.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>K[kn(e)]=0;
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
load(0);ui();$('ld').classList.add('hide');$('menu').classList.remove('hide');requestAnimationFrame(loop);
})();
